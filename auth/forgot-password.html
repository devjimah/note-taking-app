<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Reset Password | Notes</title>
    <script>
      // Apply saved theme immediately to prevent FOUC
      (function () {
        try {
          const prefs = JSON.parse(
            localStorage.getItem("notes_preferences") || "{}"
          );
          let theme = prefs.colorTheme || "light";
          if (theme === "system") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.setAttribute(
            "data-font",
            prefs.fontTheme || "sans-serif"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.setAttribute("data-font", "sans-serif");
        }
      })();
    </script>
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <!-- Logo -->
        <div class="auth-card__logo">
          <img
            src="../assets/images/logo.svg"
            alt="Notes Logo"
            class="logo logo--light"
          />
          <img
            src="../assets/images/logo-dark.svg"
            alt="Notes Logo"
            class="logo logo--dark"
          />
        </div>

        <!-- Header Text -->
        <div class="auth-card__header">
          <h1 class="auth-card__title">Forgotten your password?</h1>
          <p class="auth-card__subtitle">
            Enter your email below, and we'll send you a link to reset it.
          </p>
        </div>

        <!-- Reset Form -->
        <form class="auth-form" id="resetForm">
          <!-- Email Field -->
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <div class="form-field">
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="email@example.com"
                required
                autocomplete="email"
              />
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn--primary btn--full btn--large">
            Send Reset Link
          </button>
        </form>

        <!-- Login Link -->
        <div class="auth-footer">
          <p class="auth-footer__text">
            <a href="./login.html" class="auth-footer__link">
              <img
                src="../assets/images/icon-arrow-left.svg"
                alt=""
                aria-hidden="true"
                class="auth-footer__icon"
              />
              Back to Login
            </a>
          </p>
        </div>
      </div>
    </div>

    <script type="module" src="../js/auth.js"></script>
  </body>
</html>
