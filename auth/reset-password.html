<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Reset Your Password | Notes</title>
    <script>
      // Apply saved theme immediately to prevent FOUC
      (function () {
        try {
          const prefs = JSON.parse(
            localStorage.getItem("notes_preferences") || "{}"
          );
          let theme = prefs.colorTheme || "light";
          if (theme === "system") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.setAttribute(
            "data-font",
            prefs.fontTheme || "sans-serif"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.setAttribute("data-font", "sans-serif");
        }
      })();
    </script>
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <!-- Logo -->
        <div class="auth-card__logo">
          <img
            src="../assets/images/logo.svg"
            alt="Notes Logo"
            class="logo logo--light"
          />
          <img
            src="../assets/images/logo-dark.svg"
            alt="Notes Logo"
            class="logo logo--dark"
          />
        </div>

        <!-- Header Text -->
        <div class="auth-card__header">
          <h1 class="auth-card__title">Reset Your Password</h1>
          <p class="auth-card__subtitle">
            Choose a new password to secure your account.
          </p>
        </div>

        <!-- Reset Password Form -->
        <form class="auth-form" id="resetPasswordForm">
          <!-- New Password Field -->
          <div class="form-group">
            <label for="newPassword" class="form-label">New Password</label>
            <div class="form-field form-field--password">
              <input
                type="password"
                id="newPassword"
                name="newPassword"
                class="form-input"
                placeholder=""
                required
                autocomplete="new-password"
                minlength="8"
              />
              <button
                type="button"
                class="password-toggle"
                aria-label="Show password"
                data-toggle-password
              >
                <img
                  src="../assets/images/icon-show-password.svg"
                  alt=""
                  class="password-toggle__icon password-toggle__icon--show"
                  aria-hidden="true"
                />
                <img
                  src="../assets/images/icon-hide-password.svg"
                  alt=""
                  class="password-toggle__icon password-toggle__icon--hide"
                  aria-hidden="true"
                  hidden
                />
              </button>
            </div>
            <div class="form-hint form-hint--with-icon">
              <img
                src="../assets/images/icon-info.svg"
                alt=""
                class="form-hint__icon"
                aria-hidden="true"
              />
              <span>At least 8 characters</span>
            </div>
          </div>

          <!-- Confirm New Password Field -->
          <div class="form-group">
            <label for="confirmPassword" class="form-label"
              >Confirm New Password</label
            >
            <div class="form-field form-field--password">
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                class="form-input"
                placeholder=""
                required
                autocomplete="new-password"
                minlength="8"
              />
              <button
                type="button"
                class="password-toggle"
                aria-label="Show password"
                data-toggle-password
              >
                <img
                  src="../assets/images/icon-show-password.svg"
                  alt=""
                  class="password-toggle__icon password-toggle__icon--show"
                  aria-hidden="true"
                />
                <img
                  src="../assets/images/icon-hide-password.svg"
                  alt=""
                  class="password-toggle__icon password-toggle__icon--hide"
                  aria-hidden="true"
                  hidden
                />
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn--primary btn--full btn--large">
            Reset Password
          </button>
        </form>
      </div>
    </div>

    <script type="module" src="../js/auth.js"></script>
  </body>
</html>
